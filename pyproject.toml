[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-bot"
version = "0.1.0"
description = "Telegram bot for OpenVPN and angristan WireGuard client configurations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram==3.22.0",
    "python-dotenv==1.1.1",
    "pexpect>=4.9,<5",
    "ruff>=0.14,<1",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
